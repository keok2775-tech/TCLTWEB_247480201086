<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2 {  text-align: center;
            color: red;

        }
        h3 {
                  text-align: left;
            background-color: skyblue;
            font-size: 14pt;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;          /* Xóa khoảng cách để dính liền với h4 */
            padding: 10px;      /* Thêm lề trong cho đẹp mắt */
        }

        h4 {
            text-align: left;
            font-family: 'Times New Roman', Times, serif;
            color: yellow;
            background-color: grey;
            font-size: 14pt;
            margin: 0;          /* Xóa khoảng cách để dính liền với h3 */
            padding: 10px;      /* Thêm lề trong cho đẹp mắt */
        }
    </style>
</head>
<body>
    <h2>QUÊ HƯƠNG</h2>

    <h3>
        Trải nghìn dặm trời mây bạn tới.<br>
        Thăm quê tôi, tôi rất đỗi vui mừng!<br>
        Bạn nắn lại cùng tôi thêm buổi nữa.<br>
        Để tôi xin kể nốt chuyện quê hương.<br>
    </h3>

    <h4>
        ...Quê hương tôi có cây bầu cây nhị<br>
        Tiếng “đàn kêu tích tịch tình tang...”<br>
        Có cô Tấm nấu mình trong quả thị,<br>
        Có người em may túi đúng ba gang.<br>
    </h4>
</body>
</html>
