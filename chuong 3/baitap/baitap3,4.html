<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse; /* Gộp đường viền thành 1 nét mảnh */
            width: 100%;               /* Độ rộng bảng (tùy chỉnh) */
            text-align: center;        /* Căn giữa chữ trong toàn bộ bảng */
        }

        table, th, td {
            border: 1px solid black;   /* Đường viền 1px nét liền màu đen */
            font-size: 14pt;           /* Cỡ chữ 14pt chuẩn */
            font-family: 'Times New Roman', Times, serif;
            padding: 8px;              /* Khoảng cách cho chữ thoáng, dễ nhìn */
        }

        th {
            background-color: #f2f2f2;
        }

        .sang-chieu {
            background-color: aquamarine; 
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>thứ/buổi</th>
            <th>HAI</th>
            <th>BA</th>
            <th>TƯ</th>
            <th>NĂM</th>
            <th>SÁU</th>
            <th>BẢY</th>
            <th>CN</th>
        </tr>
        <tr>
            <td class="sang-chieu">sáng</td>
            <td>toán</td>
            <td>lý</td>
            <td>hoá</td>
            <td>toán</td>
            <td>lý</td>
            <td>hoá</td>
            <td>off</td>
        </tr>
        <tr>
            <td class="sang-chieu">chiều</td>
            <td>văn</td>
            <td>sử</td>
            <td>sinh</td>
            <td>địa</td>
            <td>gdcd</td>
            <td>anh</td>
            <td>off</td>
        </tr>
    </table>

</body>
</html>
